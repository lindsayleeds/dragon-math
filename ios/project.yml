# XcodeGen spec for the Dragon Academy iOS app. This file is the source of
# truth; DragonAcademy.xcodeproj is generated from it and committed so a plain
# Xcode checkout builds with no extra tools. After editing, regenerate with
#   cd ios && xcodegen generate
# and commit both. See ios/README.md.
name: DragonAcademy
options:
  bundleIdPrefix: dev.placeholder
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Unsigned local builds for the simulator; a team is set once the paid
    # developer account exists.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
packages:
  GameRules:
    path: Packages/GameRules
  Store:
    path: Packages/Store
  API:
    path: Packages/API
  Sync:
    path: Packages/Sync
  Audio:
    path: Packages/Audio
  Diagnostics:
    path: Packages/Diagnostics
  TextNormalization:
    path: Packages/TextNormalization
targets:
  DragonAcademy:
    type: application
    platform: iOS
    sources:
      # Includes the bundled font files in DragonAcademy/Fonts as resources
      # once they're added (Fonts/README.md; re-run xcodegen after adding
      # them). Info.plist registers them under UIAppFonts — every family's
      # files are listed there already, and a missing one is skipped.
      - path: DragonAcademy
        excludes:
          - "Fonts/*.md"
      # The rendered sound effects (Sounds/README.md), at the bundle's root,
      # where AudioPlayer.live() finds them by name.
      - path: Sounds
        includes:
          - "*.m4a"
        buildPhase: resources
      # Dragon Spelling's recorded words, straight from the web's
      # public/audio/spelling (<word>.mp3, and prompts/<word>.mp3 for a word
      # spoken with a sentence), as a folder reference so the bundle keeps
      # that layout under `spelling/` and every grade word plays offline
      # (SpellingClips; SpellingClipsTests checks each one is there).
      # `group` keeps it out of a group named after the checkout's folder.
      - path: ../public/audio/spelling
        type: folder
        group: SpellingAudio
        buildPhase: resources
    # Sign in with Apple (ADR 0007). The simulator builds with it unsigned;
    # a device build needs a paid team with the capability enabled (#171).
    # Associated Domains: kid /k/ and family /family/ links open the app
    # (#132); the server serves /.well-known/apple-app-site-association, which
    # needs APPLE_TEAM_ID set (docs/APPLE_SIGN_IN.md, "Universal links").
    entitlements:
      path: DragonAcademy/DragonAcademy.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.associated-domains:
          - applinks:mydragonmath.com
    dependencies:
      - package: GameRules
      - package: Store
      - package: API
      - package: Sync
      - package: Audio
      - package: Diagnostics
      - package: TextNormalization
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.placeholder.dragonacademy
        PRODUCT_NAME: DragonAcademy
        INFOPLIST_KEY_CFBundleDisplayName: Dragon Academy
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        # Only the keys with no INFOPLIST_KEY_ setting (the API base URL, ATS
        # allowing plain HTTP to localhost for the dev server, and UIAppFonts
        # for the bundled fonts); Xcode merges it into the generated Info.plist.
        INFOPLIST_FILE: DragonAcademy/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # iPhone is portrait only; iPad gets every orientation, which (with
        # UIRequiresFullScreen left off) is what enables Split View, Slide Over
        # and Stage Manager.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_NSFaceIDUsageDescription: Face ID keeps the parent area for grown-ups only.
        # "I have a login code": the QR scanner for kid login codes (#132).
        INFOPLIST_KEY_NSCameraUsageDescription: The camera scans your login code so you can sign in.
        ENABLE_PREVIEWS: YES
      # Server origin, as the DragonAPIBaseURL Info.plist key, read by
      # AppConfiguration.apiBaseURL. Debug is the Mac's `npm run server`,
      # which the simulator reaches on localhost; Release is production.
      configs:
        Debug:
          DRAGON_API_BASE_URL: http://localhost:3001
          DRAGON_WEB_BASE_URL: http://localhost:5173
        Release:
          DRAGON_API_BASE_URL: https://mydragonmath.com
          DRAGON_WEB_BASE_URL: https://mydragonmath.com
  DragonAcademyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DragonAcademyTests
      # The StoreKitPremiumStore tests load it with SKTestSession.
      - path: StoreKit/DragonAcademy.storekit
        buildPhase: resources
    dependencies:
      - target: DragonAcademy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.placeholder.dragonacademy.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  DragonAcademyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DragonAcademyUITests
    dependencies:
      - target: DragonAcademy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.placeholder.dragonacademy.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: DragonAcademy
schemes:
  DragonAcademy:
    build:
      targets:
        DragonAcademy: all
    test:
      gatherCoverageData: false
      # The test plan decides what runs; the targets below keep them built
      # by the scheme. Keep both lists in step when adding a package.
      testPlans:
        - path: DragonAcademy.xctestplan
          defaultPlan: true
      targets:
        - DragonAcademyTests
        - DragonAcademyUITests
        - package: GameRules/GameRulesTests
        - package: Store/StoreTests
        - package: API/APITests
        - package: Sync/SyncTests
        - package: Audio/AudioTests
        - package: Diagnostics/DiagnosticsTests
        - package: TextNormalization/TextNormalizationTests
    run:
      config: Debug
      # Local StoreKit testing: products and purchases come from this file,
      # not the App Store, when run from Xcode (docs/APP_STORE.md). Its
      # product ids must match PremiumProducts.
      storeKitConfiguration: StoreKit/DragonAcademy.storekit
