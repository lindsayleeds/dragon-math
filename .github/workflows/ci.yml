# Pull-request gate for Dragon Math.
#
# What each job is actually protecting, since none of it is obvious from the
# command names:
#
#   test   — `npm test` runs BOTH vitest projects (see vitest.config.js): the
#            CommonJS server suite on Node, and the React suite under jsdom. Two
#            server files skip themselves rather than fail when their dependency
#            is missing, and both dependencies are supplied here on purpose, so
#            the server half runs its full 108 tests rather than the 102 a bare
#            laptop runs:
#              * server/lib/rateLimit.pg.test.js needs TEST_DATABASE_URL. The
#                `postgres` service below is its scratch database — the file
#                TRUNCATEs the table it owns, so it must never be pointed at a
#                real one, and a throwaway service container satisfies that by
#                construction. It creates its own table, so no drizzle push.
#              * server/db.timeouts.test.js shells out to `docker` and boots its
#                own postgres:17-alpine. That works alongside the service
#                container because the test publishes an ephemeral host port
#                (`-p 127.0.0.1::5432`), so nothing collides with 5432 here.
#            The React half needs nothing external — jsdom plus mocked api/audio
#            — but it is NOT a full-coverage suite: it covers the gameplay hooks
#            and games that carry the react-hooks findings recorded in
#            .eslint-baseline.json, so those can be refactored safely. Treat a
#            green run as "the covered behaviour still holds", not "src/ is safe".
#
#   lint   — a ratchet, not `eslint .`: src/ carries ~80 pre-existing problems.
#            See scripts/lint-baseline.mjs for why the baseline is per file and
#            rule, and note the property that keeps server/ at zero (a file
#            absent from the baseline must be clean). Also gates the deploy shell
#            scripts, which nothing else in the repo did — `bash -n` plus a
#            pinned shellcheck that must stay clean at default severity. That
#            pass found two live defects on its first run (a heredoc that ran
#            `readlink -f` on the operator's own machine every deploy, and an
#            error message printing a literal `$TARGET`), so it earns its keep.
#
#   build  — the released-artifact deploy builds `dist/` on the box
#            (deploy/release.sh), so a bundler break is a failed deploy, not a
#            failed test. This is the only place that catches it beforehand.
#
# Deliberately NOT here: anything that needs a real secret. No DATABASE_URL, no
# Stripe/Resend keys, no deploy step — deploys stay operator-driven, and
# production refuses to be touched without DM_I_MEAN_PRODUCTION=1 anyway.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: nothing here writes to the repo, publishes a package, or deploys.
permissions:
  contents: read

# A force-push to a PR branch supersedes its own in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match the Node the app is developed and deployed on. Bump all three jobs
  # together, and check deploy/targets/ before assuming the boxes agree.
  NODE_VERSION: '22'

jobs:
  test:
    # Renaming this job renames the required status check on `main` — update the
    # branch protection contexts in the same change or merges block on a check
    # that no longer reports.
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dragonmath_test
        ports:
          - 5432:5432
        # Without this the first query can land before initdb finishes.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/dragonmath_test
        run: npm test

      # server/lib/localTime.js does its date maths in JS because Postgres has
      # no `localtime` modifier, so its correctness is timezone-shaped and the
      # check is a standalone script with no DB. Chatham is +12:45 with DST —
      # a 15-minute-offset zone is where naive arithmetic breaks.
      - name: Local-time maths across timezones
        run: |
          for tz in UTC America/Los_Angeles Asia/Kolkata Pacific/Chatham; do
            echo "--- TZ=$tz"
            TZ="$tz" node scripts/check-local-time.cjs
          done

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: ESLint (no new problems)
        run: npm run lint:ci

      # The deploy is shell, and `bash -n` catches the class of typo that would
      # otherwise surface halfway through a release. Kept alongside shellcheck
      # below because this is the real bash parser rather than a reimplementation
      # of it, and it costs milliseconds.
      - name: Shell syntax
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n

      # Clean at default severity, style included — so anything reported here is
      # new. Three details are load-bearing:
      #   -x            follow the sourced deploy/lib/common.sh, which is what
      #                 lets it resolve the helpers and colour vars every script
      #                 inherits (without it, 3 bogus SC2154s in verify.sh).
      #   -P SCRIPTDIR  resolve that source relative to each script rather than
      #                 the checkout root (without it, 6 bogus SC1091s).
      #   pinned image  `stable` is a moving tag; a shellcheck release adding a
      #                 check would turn CI red on an unrelated PR. Bump this
      #                 deliberately, with the findings fixed in the same commit.
      # Genuine exceptions are annotated in the scripts with a reason next to the
      # `# shellcheck disable=` — don't add a blanket --exclude here instead.
      - name: Shellcheck (deploy scripts)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
            -x -P SCRIPTDIR -f gcc $(git ls-files '*.sh')

  build:
    name: build (vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run build

      # The version plugin emits dist/version.json, and three consumers read
      # that one identifier (the update banner, /api/health, the deploy). A
      # build that silently stopped emitting it would only show up at deploy
      # time, as a health check that cannot name the release it is running.
      - name: Assert the build stamped a version
        run: |
          test -f dist/version.json || { echo "dist/version.json missing"; exit 1; }
          cat dist/version.json
          node -e '
            const v = require("./dist/version.json");
            for (const key of ["commit", "commitShort", "builtAt"]) {
              if (!v[key] || v[key] === "unknown") {
                console.error(`version.json ${key} is ${JSON.stringify(v[key])}`);
                process.exit(1);
              }
            }
            console.log("version.json ok:", v.commitShort);
          '
