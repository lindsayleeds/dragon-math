  </g>
  <!-- Mastery Star Accents -->
  <g fill="currentColor">
    <g transform="translate(65, 15) scale(0.8)">
      <path d="M 0 -10 Q 0 0 10 0 Q 0 0 0 10 Q 0 0 -10 0 Q 0 0 0 -10 Z" />
    </g>
    <g transform="translate(15, 70) scale(0.5)">
      <path d="M 0 -10 Q 0 0 10 0 Q 0 0 0 10 Q 0 0 -10 0 Q 0 0 0 -10 Z" />
    </g>
    <g transform="translate(70, 60) scale(0.6)">
      <path d="M 0 -10 Q 0 0 10 0 Q 0 0 0 10 Q 0 0 -10 0 Q 0 0 0 -10 Z" />
    </g>
  </g>
</svg>