<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="currentColor">
  <g transform="translate(40, 45) scale(1.05)">
    <!-- Fully spread majestic wings -->
    <path d="M -5 5 L -40 -25 L -25 5 L -45 -15 L -10 15 Z" />
    <path d="M -5 5 L -30 -35 L -15 0 Z" />
    <!-- Grand body -->
    <path d="M -5 -12 C -35 -5 -30 30 -5 35 C 30 35 30 10 10 -12 Z" />
    <!-- Sturdy legs -->
    <rect x="-15" y="24" width="16" height="18" rx="5" />
    <rect x="8" y="24" width="16" height="18" rx="5" />
    <!-- Sweeping long tail -->
    <path d="M -20 25 C -55 25 -60 -15 -40 -30 C -25 -40 -10 -5 -10 18 Z" />
    <path d="M -40 -30 L -55 -45 L -35 -35 Z" />
